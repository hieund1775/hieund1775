<svg xmlns="http://www.w3.org/2000/svg" width="560" height="390" viewBox="0 0 560 390" role="img" aria-labelledby="title desc">
  <title id="title">AI-Tasker project card</title><desc id="desc">AI-Tasker role and contribution summary.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101f"/><stop offset="1" stop-color="#10162f"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="558" height="388" rx="18" fill="url(#bg)" stroke="url(#edge)"/>
  <circle cx="500" cy="50" r="46" fill="#0891b2" opacity=".09"/><path d="M474 50h52M500 24v52" stroke="#67e8f9" opacity=".55"/><circle cx="500" cy="50" r="15" fill="none" stroke="#67e8f9" filter="url(#glow)"><animate attributeName="r" values="12;19;12" dur="3s" repeatCount="indefinite"/></circle>
  <text x="28" y="42" fill="#67e8f9" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">FEATURED SYSTEM // 01</text>
  <text x="28" y="82" fill="#f8fafc" font-size="31" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">AI-Tasker</text>
  <text x="28" y="108" fill="#94a3b8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">University project · Frontend delivery + system-flow analysis</text>

  <g transform="translate(28 128)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    <rect width="248" height="28" rx="14" fill="#052b38" stroke="#22d3ee"/><text x="124" y="18" text-anchor="middle" fill="#a5f3fc">FRONTEND CONTRIBUTOR</text>
    <g transform="translate(258 0)"><rect width="184" height="28" rx="14" fill="#17122f" stroke="#818cf8"/><text x="92" y="18" text-anchor="middle" fill="#c7d2fe">SYSTEM FLOW</text></g>
  </g>

  <text x="28" y="188" fill="#e2e8f0" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">CONTRIBUTION LENS</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    <circle cx="34" cy="217" r="4" fill="#22d3ee"/><text x="48" y="222" fill="#cbd5e1"><tspan fill="#67e8f9" font-weight="700">Frontend delivery</tspan> — turn intended behavior into usable UI</text>
    <circle cx="34" cy="250" r="4" fill="#60a5fa"/><text x="48" y="255" fill="#cbd5e1"><tspan fill="#93c5fd" font-weight="700">System-flow analysis</tspan> — trace workflows and edge cases</text>
    <circle cx="34" cy="283" r="4" fill="#818cf8"/><text x="48" y="288" fill="#cbd5e1"><tspan fill="#c4b5fd" font-weight="700">Requirement clarity</tspan> — reduce ambiguity before implementation</text>
    <circle cx="34" cy="316" r="4" fill="#2dd4bf"/><text x="48" y="321" fill="#cbd5e1"><tspan fill="#99f6e4" font-weight="700">Problem unblocking</tspan> — bridge UI behavior and system logic</text>
