  <rect x="28" y="344" width="504" height="1" fill="#164e63" opacity=".65"/>
  <text x="28" y="371" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ROLE // FRONTEND · ANALYSIS · REQUIREMENT CLARIFICATION · TROUBLESHOOTING</text>
