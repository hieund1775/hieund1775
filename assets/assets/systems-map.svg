<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Hiếu Nguyễn software systems map</title>
  <desc id="desc">A futuristic map of backend, data, frontend, cloud and foundation technologies.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="47%"><stop offset="0" stop-color="#101d3d"/><stop offset=".52" stop-color="#070d1d"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1000" height="590" rx="24" fill="url(#bg)"/>
  <text x="36" y="42" fill="#67e8f9" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">SOFTWARE SYSTEM MAP // BACKEND-FOCUSED FULL STACK</text>
  <text x="36" y="68" fill="#64748b" font-size="13" font-family="Inter, Segoe UI, Arial, sans-serif">Technologies grouped by the role they play in the system — not just a random stack list.</text>

  <circle cx="500" cy="302" r="118" fill="#2563eb" opacity=".08" filter="url(#soft)"><animate attributeName="r" values="103;132;103" dur="6s" repeatCount="indefinite"/></circle>
  <g fill="none" opacity=".34">
    <ellipse cx="500" cy="302" rx="205" ry="108" stroke="#22d3ee"/>
    <ellipse cx="500" cy="302" rx="330" ry="174" stroke="#60a5fa" transform="rotate(12 500 302)"/>
    <ellipse cx="500" cy="302" rx="405" ry="225" stroke="#c084fc" transform="rotate(-10 500 302)"/>
  </g>
  <g fill="none" stroke="url(#edge)" stroke-width="1.4" opacity=".27" stroke-dasharray="4 12">
    <ellipse cx="500" cy="302" rx="330" ry="174" transform="rotate(12 500 302)"><animateTransform attributeName="transform" type="rotate" values="12 500 302;372 500 302" dur="38s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="500" cy="302" rx="405" ry="225" transform="rotate(-10 500 302)"><animateTransform attributeName="transform" type="rotate" values="-10 500 302;-370 500 302" dur="52s" repeatCount="indefinite"/></ellipse>
  </g>

  <circle cx="500" cy="302" r="82" fill="#07152f" stroke="url(#edge)" stroke-width="2.2" filter="url(#glow)"/>
  <text x="500" y="283" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">HIẾU</text>
  <text x="500" y="309" text-anchor="middle" fill="#67e8f9" font-size="12" letter-spacing="2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SYSTEMS ENGINEERING</text>
  <text x="500" y="332" text-anchor="middle" fill="#94a3b8" font-size="12" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BACKEND FOCUS</text>
  <circle cx="500" cy="302" r="99" fill="none" stroke="#38bdf8" opacity=".25" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" values="0 500 302;360 500 302" dur="17s" repeatCount="indefinite"/></circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <!-- backend -->
    <g transform="translate(505 111)"><rect x="-56" y="-20" width="112" height="40" rx="20" fill="#042a35" stroke="#22d3ee"/><text y="5" fill="#cffafe">JAVA</text></g>
    <g transform="translate(700 155)"><rect x="-62" y="-20" width="124" height="40" rx="20" fill="#042a35" stroke="#22d3ee"/><text y="5" fill="#cffafe">NODE.JS</text></g>
    <!-- data -->
    <g transform="translate(833 272)"><rect x="-72" y="-20" width="144" height="40" rx="20" fill="#0b2342" stroke="#60a5fa"/><text y="5" fill="#dbeafe">POSTGRESQL</text></g>
    <g transform="translate(775 427)"><rect x="-58" y="-20" width="116" height="40" rx="20" fill="#0b2342" stroke="#60a5fa"/><text y="5" fill="#dbeafe">MYSQL</text></g>
    <g transform="translate(624 485)"><rect x="-65" y="-20" width="130" height="40" rx="20" fill="#0b2342" stroke="#60a5fa"/><text y="5" fill="#dbeafe">SUPABASE</text></g>
    <!-- infra -->
    <g transform="translate(442 500)"><rect x="-58" y="-20" width="116" height="40" rx="20" fill="#17122f" stroke="#a78bfa"/><text y="5" fill="#ede9fe">DOCKER</text></g>
    <g transform="translate(282 438)"><rect x="-46" y="-20" width="92" height="40" rx="20" fill="#17122f" stroke="#a78bfa"/><text y="5" fill="#ede9fe">AWS</text></g>
    <!-- frontend -->
    <g transform="translate(182 294)"><rect x="-50" y="-20" width="100" height="40" rx="20" fill="#1f1032" stroke="#d946ef"/><text y="5" fill="#fae8ff">REACT</text></g>
    <g transform="translate(286 151)"><rect x="-73" y="-20" width="146" height="40" rx="20" fill="#1f1032" stroke="#d946ef"/><text y="5" fill="#fae8ff">TYPESCRIPT</text></g>
    <!-- foundation -->
    <g transform="translate(333 318)"><rect x="-36" y="-20" width="72" height="40" rx="20" fill="#0a2832" stroke="#2dd4bf"/><text y="5" fill="#ccfbf1">C</text></g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    <g transform="translate(68 540)"><circle cx="0" cy="0" r="5" fill="#22d3ee"/><text x="12" y="4" fill="#94a3b8">BACKEND</text></g>
    <g transform="translate(184 540)"><circle cx="0" cy="0" r="5" fill="#60a5fa"/><text x="12" y="4" fill="#94a3b8">DATA</text></g>
    <g transform="translate(270 540)"><circle cx="0" cy="0" r="5" fill="#d946ef"/><text x="12" y="4" fill="#94a3b8">FRONTEND</text></g>
    <g transform="translate(390 540)"><circle cx="0" cy="0" r="5" fill="#a78bfa"/><text x="12" y="4" fill="#94a3b8">INFRA / CLOUD</text></g>
    <g transform="translate(550 540)"><circle cx="0" cy="0" r="5" fill="#2dd4bf"/><text x="12" y="4" fill="#94a3b8">FOUNDATION</text></g>
  </g>
  <text x="932" y="544" text-anchor="end" fill="#475569" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BACKEND • DATA • CLIENT • CLOUD</text>
  <rect x="1" y="1" width="998" height="588" rx="23" fill="none" stroke="url(#edge)" opacity=".28"/>
</svg>
