<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">OrderStore project card</title><desc id="desc">OrderStore role and contribution summary.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071020"/><stop offset="1" stop-color="#190e2b"/></linearGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#d946ef"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect x="1" y="1" width="558" height="358" rx="18" fill="url(#bg)" stroke="url(#edge)"/>
  <g transform="translate(500 50)" fill="none" stroke="#c084fc" filter="url(#glow)"><polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" opacity=".72"><animateTransform attributeName="transform" type="rotate" values="0;360" dur="10s" repeatCount="indefinite"/></polygon><circle r="7" fill="#a78bfa" stroke="none"/></g>
  <text x="28" y="42" fill="#c4b5fd" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">FEATURED SYSTEM // 02</text>
  <text x="28" y="82" fill="#f8fafc" font-size="31" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">OrderStore</text>
  <text x="28" y="108" fill="#94a3b8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">Real-world project for Amazing · leading implementation direction</text>

  <g transform="translate(28 128)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">
    <rect width="190" height="28" rx="14" fill="#0b2342" stroke="#60a5fa"/><text x="95" y="18" text-anchor="middle" fill="#bfdbfe">PROJECT LEAD</text>
    <g transform="translate(200 0)"><rect width="242" height="28" rx="14" fill="#24113a" stroke="#d946ef"/><text x="121" y="18" text-anchor="middle" fill="#fae8ff">SYSTEM-LEVEL THINKING</text></g>
  </g>

  <text x="28" y="186" fill="#e2e8f0" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="1.5">WHAT I DRIVE</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">
    <circle cx="34" cy="213" r="4" fill="#60a5fa"/><text x="48" y="218" fill="#cbd5e1"><tspan fill="#f8fafc" font-weight="700">Business → system</tspan> — translate real scenarios into behavior</text>
    <circle cx="34" cy="244" r="4" fill="#818cf8"/><text x="48" y="249" fill="#cbd5e1"><tspan fill="#c7d2fe" font-weight="700">Trade-offs</tspan> — reason from both user and developer views</text>
    <circle cx="34" cy="275" r="4" fill="#c084fc"/><text x="48" y="280" fill="#cbd5e1"><tspan fill="#e9d5ff" font-weight="700">Structure</tspan> — shape clear implementation and system decisions</text>
    <circle cx="34" cy="306" r="4" fill="#d946ef"/><text x="48" y="311" fill="#cbd5e1"><tspan fill="#fae8ff" font-weight="700">AI-assisted delivery</tspan> — use AI as a controlled engineering tool</text>
  </g>
  <text x="28" y="342" fill="#64748b" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ROLE // LEAD · ANALYSIS · ARCHITECTURE-ORIENTED DELIVERY</text>
</svg>
