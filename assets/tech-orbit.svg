<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Hiếu Nguyễn technology orbit</title>
  <desc id="desc">Animated futuristic map of backend, frontend, database and cloud technologies.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%">
      <stop offset="0" stop-color="#101d3d"/>
      <stop offset="0.5" stop-color="#070d1d"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1000" height="540" rx="24" fill="url(#bg)"/>
  <circle cx="500" cy="270" r="110" fill="#2563eb" opacity="0.08" filter="url(#soft)">
    <animate attributeName="r" values="95;125;95" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#155e75" opacity="0.38">
    <ellipse cx="500" cy="270" rx="210" ry="110"/>
    <ellipse cx="500" cy="270" rx="320" ry="170" transform="rotate(16 500 270)"/>
    <ellipse cx="500" cy="270" rx="390" ry="215" transform="rotate(-12 500 270)"/>
  </g>

  <g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity="0.28" stroke-dasharray="4 12">
    <ellipse cx="500" cy="270" rx="320" ry="170" transform="rotate(16 500 270)">
      <animateTransform attributeName="transform" type="rotate" values="16 500 270;376 500 270" dur="36s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="500" cy="270" rx="390" ry="215" transform="rotate(-12 500 270)">
      <animateTransform attributeName="transform" type="rotate" values="-12 500 270;-372 500 270" dur="48s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="500" cy="270" r="74" fill="#07152f" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <text x="500" y="259" fill="#ecfeff" font-size="24" font-weight="800">HIẾU</text>
    <text x="500" y="285" fill="#67e8f9" font-size="13" letter-spacing="2">BACKEND CORE</text>
    <circle cx="500" cy="270" r="90" fill="none" stroke="#38bdf8" opacity="0.25" stroke-dasharray="3 9">
      <animateTransform attributeName="transform" type="rotate" values="0 500 270;360 500 270" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <g transform="translate(500 90)"><rect x="-55" y="-19" width="110" height="38" rx="19" fill="#0b1225" stroke="#67e8f9"/><text y="5" fill="#e0f2fe">JAVA</text></g>
    <g transform="translate(710 135)"><rect x="-62" y="-19" width="124" height="38" rx="19" fill="#0b1225" stroke="#60a5fa"/><text y="5" fill="#dbeafe">NODE.JS</text></g>
    <g transform="translate(825 255)"><rect x="-72" y="-19" width="144" height="38" rx="19" fill="#0b1225" stroke="#a78bfa"/><text y="5" fill="#ede9fe">POSTGRESQL</text></g>
    <g transform="translate(760 400)"><rect x="-58" y="-19" width="116" height="38" rx="19" fill="#0b1225" stroke="#22d3ee"/><text y="5" fill="#cffafe">MYSQL</text></g>
    <g transform="translate(570 452)"><rect x="-58" y="-19" width="116" height="38" rx="19" fill="#0b1225" stroke="#60a5fa"/><text y="5" fill="#dbeafe">DOCKER</text></g>
    <g transform="translate(375 450)"><rect x="-46" y="-19" width="92" height="38" rx="19" fill="#0b1225" stroke="#a78bfa"/><text y="5" fill="#ede9fe">AWS</text></g>
    <g transform="translate(210 376)"><rect x="-67" y="-19" width="134" height="38" rx="19" fill="#0b1225" stroke="#22d3ee"/><text y="5" fill="#cffafe">SUPABASE</text></g>
    <g transform="translate(180 225)"><rect x="-50" y="-19" width="100" height="38" rx="19" fill="#0b1225" stroke="#60a5fa"/><text y="5" fill="#dbeafe">REACT</text></g>
    <g transform="translate(292 122)"><rect x="-72" y="-19" width="144" height="38" rx="19" fill="#0b1225" stroke="#a78bfa"/><text y="5" fill="#ede9fe">TYPESCRIPT</text></g>
    <g transform="translate(315 293)"><rect x="-36" y="-19" width="72" height="38" rx="19" fill="#0b1225" stroke="#67e8f9"/><text y="5" fill="#e0f2fe">C</text></g>
  </g>

  <g fill="#67e8f9" opacity="0.8">
    <circle cx="500" cy="90" r="3"><animate attributeName="r" values="2;5;2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="825" cy="255" r="3"><animate attributeName="r" values="2;5;2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="376" r="3"><animate attributeName="r" values="2;5;2" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="500" y="515" text-anchor="middle" fill="#475569" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">SYSTEM MAP // BACKEND • DATA • FRONTEND • CLOUD</text>
  <rect x="1" y="1" width="998" height="538" rx="23" fill="none" stroke="url(#neon)" opacity="0.22"/>
</svg>
