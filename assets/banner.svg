<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hiếu Nguyễn — Backend Developer and Software Engineer</title>
  <desc id="desc">Animated futuristic space banner with orbit lines and developer status text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#08152f"/>
      <stop offset="1" stop-color="#140b2d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="30%">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.35" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#312e81"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#164e63" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    <clipPath id="typingClip">
      <rect x="138" y="249" width="0" height="29">
        <animate attributeName="width" values="0;530;530;0" keyTimes="0;0.32;0.84;1" dur="7s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <circle cx="1060" cy="62" r="92" fill="#312e81" opacity="0.16" filter="url(#softGlow)">
    <animate attributeName="r" values="80;108;80" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1025" cy="178" r="70" fill="url(#planet)" opacity="0.92"/>
  <ellipse cx="1025" cy="178" rx="123" ry="34" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.55" transform="rotate(-14 1025 178)">
    <animateTransform attributeName="transform" type="rotate" values="-14 1025 178;346 1025 178" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1025" cy="178" rx="100" ry="23" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.25" transform="rotate(18 1025 178)">
    <animateTransform attributeName="transform" type="rotate" values="18 1025 178;-342 1025 178" dur="24s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#e0f2fe">
    <circle cx="85" cy="58" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="105" r="1"><animate attributeName="opacity" values="1;0.15;1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="322" cy="48" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="495" cy="78" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="645" cy="43" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="775" cy="96" r="1"><animate attributeName="opacity" values="0.15;1;0.15" dur="5.7s" repeatCount="indefinite"/></circle>
    <circle cx="885" cy="42" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1135" cy="285" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="308" r="1"><animate attributeName="opacity" values="1;0.15;1" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="305" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="321" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="302" cy="305" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="97" cy="293" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="5.4s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M65 104 H420" stroke="#22d3ee" stroke-width="1" opacity="0.25"/>
  <path d="M65 108 H255" stroke="#a78bfa" stroke-width="2" opacity="0.55">
    <animate attributeName="x2" values="85;360;85" dur="5s" repeatCount="indefinite"/>
  </path>

  <text x="72" y="87" fill="#67e8f9" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">SYSTEM // DEVELOPER PROFILE</text>

  <text x="68" y="176" fill="url(#neon)" font-size="58" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="1.5" filter="url(#glow)">HIẾU NGUYỄN</text>
  <text x="72" y="216" fill="#cbd5e1" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" letter-spacing="1">BACKEND DEVELOPER  /  SOFTWARE ENGINEER</text>

  <g clip-path="url(#typingClip)">
    <text x="72" y="270" fill="#a5f3fc" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&gt; building clean systems from real-world problems</text>
  </g>
  <rect x="600" y="251" width="10" height="24" fill="#67e8f9">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(72 305)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <circle cx="6" cy="0" r="5" fill="#22c55e"><animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/></circle>
    <text x="20" y="4" fill="#94a3b8">STATUS: LEARNING / BUILDING / ITERATING</text>
  </g>

  <g transform="translate(1025 178)">
    <circle r="5" fill="#ecfeff" filter="url(#glow)"/>
    <circle r="95" fill="none" stroke="#38bdf8" stroke-dasharray="2 12" opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="url(#neon)" stroke-width="1.2" opacity="0.35"/>
</svg>
