<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Hiếu Nguyễn engineering profile configuration</title>
  <desc id="desc">A colorful terminal-style profile showing role, education, focus, learning direction and engineering mindset.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset=".58" stop-color="#07152a"/><stop offset="1" stop-color="#160b2d"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#1e3a5f" opacity=".45"/></pattern>
  </defs>

  <rect x="1" y="1" width="1098" height="518" rx="22" fill="url(#bg)" stroke="#1e3a5f"/>
  <rect x="1" y="1" width="1098" height="518" rx="22" fill="url(#dots)" opacity=".45"/>
  <rect x="1" y="1" width="1098" height="52" rx="22" fill="#0b1220"/>
  <rect x="1" y="35" width="1098" height="18" fill="#0b1220"/>
  <circle cx="28" cy="26" r="6" fill="#fb7185"/><circle cx="50" cy="26" r="6" fill="#fbbf24"/><circle cx="72" cy="26" r="6" fill="#4ade80"/>
  <text x="550" y="31" text-anchor="middle" fill="#64748b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">profile.config.yml — engineering identity</text>
  <rect x="1" y="51" width="1098" height="2" fill="url(#edge)" opacity=".85"/>

  <text x="38" y="84" fill="#67e8f9" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="3">ABOUT.ME // ENGINEERING PROFILE</text>

  <!-- left: syntax-highlighted config -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
    <text x="42" y="126" fill="#64748b">profile:</text>

    <text x="68" y="158"><tspan fill="#86efac">name:</tspan><tspan fill="#bae6fd"> "Hiếu Nguyễn"</tspan></text>
    <text x="68" y="190"><tspan fill="#86efac">role:</tspan><tspan fill="#bae6fd"> "Backend Developer / Software Engineer"</tspan></text>
    <text x="68" y="222"><tspan fill="#86efac">education:</tspan><tspan fill="#bae6fd"> "Software Engineering @ FPT University"</tspan></text>

    <text x="68" y="267" fill="#86efac">focus:</text>
    <text x="96" y="296"><tspan fill="#64748b">- </tspan><tspan fill="#67e8f9">backend systems</tspan><tspan fill="#64748b">  /  </tspan><tspan fill="#60a5fa">API design</tspan><tspan fill="#64748b">  /  </tspan><tspan fill="#c084fc">databases</tspan></text>
    <text x="96" y="326"><tspan fill="#64748b">- </tspan><tspan fill="#2dd4bf">system analysis</tspan><tspan fill="#64748b">  /  </tspan><tspan fill="#93c5fd">task processing</tspan><tspan fill="#64748b">  /  </tspan><tspan fill="#d8b4fe">clean architecture</tspan></text>

    <text x="68" y="371"><tspan fill="#86efac">learning:</tspan><tspan fill="#bae6fd"> [</tspan><tspan fill="#f0abfc">software architecture</tspan><tspan fill="#bae6fd">, </tspan><tspan fill="#c4b5fd">distributed systems</tspan><tspan fill="#bae6fd">, </tspan><tspan fill="#67e8f9">AI workflows</tspan><tspan fill="#bae6fd">]</tspan></text>
    <text x="68" y="407"><tspan fill="#86efac">mindset:</tspan><tspan fill="#fde68a"> "Understand reality first -&gt; design the system around it"</tspan></text>
    <text x="68" y="443"><tspan fill="#86efac">direction:</tspan><tspan fill="#f0abfc"> "strong engineer -&gt; senior / architecture ownership"</tspan></text>
    <text x="42" y="482" fill="#64748b">status: <tspan fill="#4ade80">ACTIVE</tspan><tspan fill="#64748b">  // learning · building · iterating</tspan></text>
  </g>

  <!-- right: readable signal cards -->
  <g transform="translate(690 116)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="0" fill="#94a3b8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">ENGINEERING SIGNALS</text>

    <g transform="translate(0 24)"><rect width="360" height="72" rx="14" fill="#062332" stroke="#22d3ee"/><rect width="6" height="72" rx="3" fill="#22d3ee"/><text x="24" y="27" fill="#67e8f9" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">BACKEND</text><text x="24" y="52" fill="#e2e8f0" font-size="15">APIs · workflows · data · reliability</text></g>
    <g transform="translate(0 108)"><rect width="360" height="72" rx="14" fill="#0b1d39" stroke="#60a5fa"/><rect width="6" height="72" rx="3" fill="#60a5fa"/><text x="24" y="27" fill="#93c5fd" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">SYSTEM THINKING</text><text x="24" y="52" fill="#e2e8f0" font-size="15">requirements → behavior → implementation</text></g>
    <g transform="translate(0 192)"><rect width="360" height="72" rx="14" fill="#171531" stroke="#a78bfa"/><rect width="6" height="72" rx="3" fill="#a78bfa"/><text x="24" y="27" fill="#c4b5fd" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">ARCHITECTURE PATH</text><text x="24" y="52" fill="#e2e8f0" font-size="15">clean boundaries · trade-offs · system design</text></g>
    <g transform="translate(0 276)"><rect width="360" height="72" rx="14" fill="#21102d" stroke="#d946ef"/><rect width="6" height="72" rx="3" fill="#d946ef"/><text x="24" y="27" fill="#f0abfc" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">AI-ASSISTED</text><text x="24" y="52" fill="#e2e8f0" font-size="15">use AI as a tool, keep engineering judgment</text></g>
  </g>

  <circle cx="1060" cy="82" r="4" fill="#67e8f9" filter="url(#glow)"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1098" height="518" rx="22" fill="none" stroke="url(#edge)" opacity=".32"/>
</svg>
