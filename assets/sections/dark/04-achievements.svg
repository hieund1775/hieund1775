<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FACC15" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <g opacity="0.42">
    <path d="M0 83 H1000" stroke="#0F172A" stroke-width="1"/>
    <path d="M160 0 V90" stroke="#0F172A" stroke-width="1" stroke-dasharray="2 8"/>
  </g>

  <circle cx="22" cy="26" r="7" fill="#FACC15" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="22" cy="26" r="3.5" fill="#FACC15"/>

  <text x="42" y="31"
        fill="#FACC15"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="15"
        font-weight="700"
        letter-spacing="1.4">04 //</text>

  <text x="108" y="31"
        fill="#E6EDF3"
        font-family="Inter, Segoe UI, Arial, sans-serif"
        font-size="22"
        font-weight="800"
        letter-spacing="0.7">ACHIEVEMENTS</text>

  <line x1="360" y1="25.5" x2="970" y2="25.5" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <circle cx="973" cy="25.5" r="3.2" fill="#FACC15">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <text x="42" y="62"
        fill="#94A3B8"
        font-family="JetBrains Mono, Fira Code, Consolas, monospace"
        font-size="12"
        letter-spacing="0.8">milestones, trophies &amp; public indicators</text>

  <rect x="42" y="73" width="96" height="2" rx="1" fill="#FACC15" opacity="0.78"/>
  <rect x="144" y="73" width="26" height="2" rx="1" fill="#FACC15" opacity="0.28"/>
</svg>
