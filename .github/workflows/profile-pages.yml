name: Publish Profile Assets (No Bot Commits)

on:
  schedule:
    - cron: '12 * * * *'   # Weather refreshed hourly
    - cron: '5 0 * * *'  # Telemetry + Space Shooter at 00:05 UTC / 07:05 Vietnam
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-pages.yml'
      - 'scripts/generate_profile_pages.py'
      - 'scripts/generate_telemetry.py'
      - 'dragon-site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: profile-pages-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository (read only)
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build profile assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REFRESH: ${{ github.event_name != 'schedule' || github.event.schedule == '5 0 * * *' }}
        run: |
          set -euo pipefail
          if [ "$FULL_REFRESH" = "true" ]; then
            python -m pip install gh-space-shooter
            python scripts/generate_profile_pages.py --mode full --output _site
          else
            python scripts/generate_profile_pages.py --mode weather --output _site
          fi
      - name: Upload Pages site without committing generated files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
