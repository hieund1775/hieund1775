name: Generate contribution snake

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%2322d3ee&color_dots=%23ebedf0,%2360a5fa,%2338bdf8,%23818cf8,%23d946ef
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2367e8f9&color_dots=%230f172a,%23164e63,%230891b2,%2322d3ee,%23a78bfa

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
