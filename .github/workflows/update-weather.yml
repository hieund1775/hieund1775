name: Update Mini Weather

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update weather line in README
        shell: python
        run: |
          import json
          import re
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          url = (
              "https://api.open-meteo.com/v1/forecast"
              "?latitude=10.8231"
              "&longitude=106.6297"
              "&current=temperature_2m,weather_code"
              "&timezone=Asia%2FHo_Chi_Minh"
          )

          with urllib.request.urlopen(url, timeout=20) as response:
              data = json.load(response)

          current = data["current"]
          temperature = round(float(current["temperature_2m"]))
          code = int(current["weather_code"])

          if code == 0:
              icon = "☀️"
          elif code in (1, 2):
              icon = "🌤"
          elif code == 3:
              icon = "☁️"
          elif code in (45, 48):
              icon = "🌫️"
          elif code in (51, 53, 55, 56, 57, 61, 63, 65, 66, 67):
              icon = "🌧️"
          elif code in (71, 73, 75, 77, 85, 86):
              icon = "❄️"
          elif code in (80, 81, 82):
              icon = "🌦️"
          elif code in (95, 96, 99):
              icon = "⛈️"
          else:
              icon = "🌤"

          now = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh"))
          date = now.strftime("%d/%m/%Y")

          replacement = (
              "<!-- WEATHER_START -->\n"
              f'<p align="center">{icon} Ho Chi Minh City · {date} · {temperature}°C</p>\n'
              "<!-- WEATHER_END -->"
          )

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r"<!-- WEATHER_START -->.*?<!-- WEATHER_END -->",
              replacement,
              text,
              flags=re.S,
          )

          if count != 1:
              raise RuntimeError("Could not find exactly one WEATHER_START/WEATHER_END block in README.md")

          path.write_text(updated, encoding="utf-8")

      - name: Commit weather update
        run: |
          if git diff --quiet -- README.md; then
            echo "Weather line has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(profile): update mini weather"
          git push
